# Netlify configuration for GLITCH.GARDEN (static Vite build, local-demo mode by default).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  # Playwright browsers are only needed for e2e tests, never for the build.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  # Runtime mode. Set VITE_APP_MODE=shared plus VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY
  # in the Netlify UI to enable the shared world. Never put service-role keys here.
  VITE_APP_MODE = "local"

# Single-page app: every path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Supabase hosts are allowed for the optional shared mode; everything else stays same-origin.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
